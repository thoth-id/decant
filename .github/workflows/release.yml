name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the GitHub Release
  id-token: write  # npm trusted publishing (OIDC), so no NPM_TOKEN is stored

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: latest

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; the one bundled with Node is older.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck

      # A tag that disagrees with package.json publishes the wrong version under
      # the right name, and npm versions cannot be replaced. Stop before that.
      - name: The tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag says $tag, package.json says $pkg"
            exit 1
          fi

      # Staged, not direct: the workflow puts the version in the staging area and
      # a human approves it. An npm version can never be replaced, so a bad tag
      # publishing straight to the registry burns that number permanently —
      # staged, it is rejected and nothing reached anyone.
      - run: npm stage publish

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
