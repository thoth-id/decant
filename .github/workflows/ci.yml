name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything. The repository default is already read-only,
# but stating it keeps this job restricted if that default ever changes.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
